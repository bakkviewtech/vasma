    <!-- AUTHENTICATION CHECK - MUST BE FIRST SCRIPT -->
    <script>
      (function() {
        // Check if user is logged in
        const token = localStorage.getItem('vasma_token');
        const user = localStorage.getItem('vasma_user');
        const loginTime = localStorage.getItem('vasma_login_time');
        
        // If not logged in, redirect to login page immediately
        if (!token || !user) {
          window.location.replace('login.html');
          return;
        }
        
        // Check if session is expired (8 hours)
        if (loginTime) {
          const hoursSinceLogin = (new Date() - new Date(loginTime)) / (1000 * 60 * 60);
          if (hoursSinceLogin >= 8) {
            // Clear expired session
            localStorage.removeItem('vasma_token');
            localStorage.removeItem('vasma_user');
            localStorage.removeItem('vasma_login_time');
            window.location.replace('login.html');
            return;
          }
        }
        
        // Optional: Verify user object is valid
        try {
          const userData = JSON.parse(user);
          if (!userData.id || !userData.username) {
            throw new Error('Invalid user data');
          }
        } catch (e) {
          localStorage.clear();
          window.location.replace('login.html');
          return;
        }
        
        // Store user data globally for use in app
        window.currentUser = JSON.parse(user);
      })();
    </script>

    <!-- Additional script to display user info -->
    <script>
      (function displayUserInfo() {
        try {
          const userData = window.currentUser || JSON.parse(localStorage.getItem('vasma_user') || '{}');
          const userName = userData.name || userData.username || 'User';
          const userRole = userData.role || 'staff';
          const topUserName = document.getElementById('topUserName');
          
          if (topUserName) topUserName.textContent = userName;
          
          // Update brand business name if available from settings
          if (userData.businessName) {
            const brandBusinessName = document.getElementById('brandBusinessName');
            if (brandBusinessName) brandBusinessName.textContent = userData.businessName;
          }
        } catch (e) {
          console.error('Error displaying user info:', e);
        }
      })();
    </script>
