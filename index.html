    <!-- AUTHENTICATION CHECK - MUST BE FIRST SCRIPT -->
    <script>
      (function() {
        // Check if user is logged in
        const token = localStorage.getItem('vasma_token');
        const user = localStorage.getItem('vasma_user');
        const loginTime = localStorage.getItem('vasma_login_time');
        
        // If not logged in, redirect to login page immediately
        if (!token || !user) {
          window.location.replace('login.html');
          return;
        }
        
        // Check if session is expired (8 hours)
        if (loginTime) {
          const hoursSinceLogin = (new Date() - new Date(loginTime)) / (1000 * 60 * 60);
          if (hoursSinceLogin >= 8) {
            // Clear expired session
            localStorage.removeItem('vasma_token');
            localStorage.removeItem('vasma_user');
            localStorage.removeItem('vasma_login_time');
            window.location.replace('login.html');
            return;
          }
        }
        
        // Optional: Verify user object is valid
        try {
          const userData = JSON.parse(user);
          if (!userData.id || !userData.username) {
            throw new Error('Invalid user data');
          }
        } catch (e) {
          localStorage.clear();
          window.location.replace('login.html');
          return;
        }
        
        // Store user data globally for use in app
        window.currentUser = JSON.parse(user);
      })();
    </script>

    <!-- Hover Dropdown Menu JavaScript (No Arrow Version) -->
    <script>
      (function() {
        // Add hover functionality to all dropdowns
        const dropdowns = document.querySelectorAll('.nav-dropdown');
        
        let hoverTimeout;
        
        dropdowns.forEach(dropdown => {
          const btn = dropdown.querySelector('.nav-dropdown-btn');
          const menu = dropdown.querySelector('.nav-dropdown-content');
          
          if (!btn || !menu) return;
          
          // Handle mouse enter on dropdown container
          dropdown.addEventListener('mouseenter', function() {
            clearTimeout(hoverTimeout);
            // Close all other dropdowns first
            dropdowns.forEach(d => {
              if (d !== dropdown) {
                const otherMenu = d.querySelector('.nav-dropdown-content');
                const otherBtn = d.querySelector('.nav-dropdown-btn');
                if (otherMenu) otherMenu.classList.remove('show');
                if (otherBtn) otherBtn.classList.remove('active');
              }
            });
            // Open current dropdown
            menu.classList.add('show');
            btn.classList.add('active');
          });
          
          // Handle mouse leave on dropdown container
          dropdown.addEventListener('mouseleave', function() {
            hoverTimeout = setTimeout(() => {
              menu.classList.remove('show');
              btn.classList.remove('active');
            }, 200);
          });
          
          // Keep menu open when hovering over the menu itself
          menu.addEventListener('mouseenter', function() {
            clearTimeout(hoverTimeout);
          });
          
          menu.addEventListener('mouseleave', function() {
            menu.classList.remove('show');
            btn.classList.remove('active');
          });
        });
        
        // Handle dropdown item clicks
        document.querySelectorAll('.nav-dropdown-item').forEach(item => {
          item.addEventListener('click', function(e) {
            e.stopPropagation();
            
            const viewName = this.getAttribute('data-view');
            if (viewName) {
              // Close all dropdowns
              document.querySelectorAll('.nav-dropdown-content').forEach(menu => {
                menu.classList.remove('show');
              });
              document.querySelectorAll('.nav-dropdown-btn').forEach(btn => {
                btn.classList.remove('active');
              });
              
              // Trigger view change
              if (typeof window.switchView === 'function') {
                window.switchView(viewName);
              } else {
                // Dispatch custom event for app.js to handle
                const event = new CustomEvent('viewChange', { detail: { view: viewName } });
                document.dispatchEvent(event);
              }
            }
          });
        });
        
        // For mobile devices - fallback to click on touch devices
        if ('ontouchstart' in window) {
          dropdowns.forEach(dropdown => {
            const btn = dropdown.querySelector('.nav-dropdown-btn');
            const menu = dropdown.querySelector('.nav-dropdown-content');
            
            if (!btn || !menu) return;
            
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              e.preventDefault();
              
              const isOpen = menu.classList.contains('show');
              
              // Close all dropdowns
              dropdowns.forEach(d => {
                const m = d.querySelector('.nav-dropdown-content');
                const b = d.querySelector('.nav-dropdown-btn');
                if (m && m !== menu) m.classList.remove('show');
                if (b) b.classList.remove('active');
              });
              
              if (!isOpen) {
                menu.classList.add('show');
                btn.classList.add('active');
              } else {
                menu.classList.remove('show');
                btn.classList.remove('active');
              }
            });
          });
        }
        
        console.log('Hover dropdown menu initialized (no arrows)');
      })();
    </script>
    
    <style>
      /* Dropdown Styles - Hover Version (No Arrows) */
      .nav-dropdown {
        position: relative;
        width: 100%;
      }
      
      .nav-dropdown-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s;
        text-align: left;
        font-weight: 500;
      }
      
      .nav-dropdown-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }
      
      .nav-dropdown-btn.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }
      
      .nav-dropdown-content {
        display: none;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        margin: 4px 8px 8px 8px;
        padding: 4px 0;
        max-height: 300px;
        overflow-y: auto;
        backdrop-filter: blur(10px);
      }
      
      .nav-dropdown-content.show {
        display: block;
        animation: slideDown 0.2s ease;
      }
      
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .nav-dropdown-item {
        width: 100%;
        padding: 10px 16px 10px 32px;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        transition: all 0.2s;
      }
      
      .nav-dropdown-item:hover {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        padding-left: 40px;
      }
      
      /* Sidebar Footer - Logout Button Removed */
      .sidebar-footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 20px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);

      .user-info {

        padding: 8px;
        background: rgba(255, 255, 255, 0.1);

      .user-avatar {

      }
      
      .user-details {

      }
      
      .user-name {
        font-weight: 600;
        font-size: 14px;
        color: white;
      }
      
      .user-role {

        color: rgba(255, 255, 255, 0.7);

        gap: 15px;

      .top-user-name {

        color: #333;

      }
      
      /* Mobile adjustments */
      @media (max-width: 768px) {
        .sidebar-footer {
          padding: 15px 12px;
        }
        
        .user-info {
          padding: 6px;
        }
        
        .user-avatar {
          font-size: 28px;
        }
        
        .top-user-name {
          font-size: 12px;
        }
        
        .nav-dropdown-item {
          padding: 8px 16px 8px 28px;
          font-size: 12px;
        }
        
        .nav-dropdown-item:hover {
          padding-left: 32px;
        }
        
        /* On mobile, larger tap targets */
        .nav-dropdown-btn {
          padding: 14px 16px;
        }
      }
      
      /* Sidebar scroll adjustment */
      .sidebar {
        overflow-y: auto;
        padding-bottom: 100px;
      }
      
      /* Smooth transitions */
      .nav-dropdown-content,
      .nav-dropdown-btn,
      .nav-dropdown-item {
        transition: all 0.2s ease;
      }
    </style>
    
    <!-- Display user info script -->
    <script>
      (function displayUserInfo() {
        try {
          const userData = window.currentUser || JSON.parse(localStorage.getItem('vasma_user') || '{}');
          const userName = userData.name || userData.username || 'User';
          const userRole = userData.role || 'staff';
          
          // Update sidebar user info
          const sidebarUserName = document.getElementById('sidebarUserName');
          const sidebarUserRole = document.getElementById('sidebarUserRole');
          const topUserName = document.getElementById('topUserName');
          
          if (sidebarUserName) sidebarUserName.textContent = userName;
          if (sidebarUserRole) sidebarUserRole.textContent = userRole.charAt(0).toUpperCase() + userRole.slice(1);
          if (topUserName) topUserName.textContent = userName;
          
          // Update brand business name if available from settings
          if (userData.businessName) {
            const brandBusinessName = document.getElementById('brandBusinessName');
            if (brandBusinessName) brandBusinessName.textContent = userData.businessName;
          }
        } catch (e) {
          console.error('Error displaying user info:', e);
        }
      })();
    </script>
