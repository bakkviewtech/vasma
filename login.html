<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VASMA System</title>
    <link rel="stylesheet" href="styles.css?v=43">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #155e75 0%, #0f3b4d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .brand-mark {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #155e75 0%, #0f3b4d 100%);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 20px;
        }
        
        .login-header h2 {
            color: #155e75;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #155e75;
            box-shadow: 0 0 0 3px rgba(21, 94, 117, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #155e75 0%, #0f3b4d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(21, 94, 117, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #c33;
        }
        
        .info-text {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #888;
            font-size: 12px;
        }
        
        .demo-credentials {
            background: #f0f9ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
            color: #155e75;
        }
        
        .demo-credentials code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="brand-mark">V</div>
            <h2>VASMA System</h2>
            <p>Vehicle Auto Service Management</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="login-btn">Login to Dashboard</button>
        </form>
        
        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br>
            Username: <code>admin</code> | Password: <code>admin123</code>
        </div>
        
        <div class="info-text">
            © 2024 VASMA System. All rights reserved.
        </div>
    </div>

    <script>
        // Get elements
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('errorMessage');
        
        // Check if already logged in
        function checkExistingSession() {
            const token = localStorage.getItem('vasma_token');
            const user = localStorage.getItem('vasma_user');
            const loginTime = localStorage.getItem('vasma_login_time');
            
            if (token && user && loginTime) {
                const hoursSinceLogin = (new Date() - new Date(loginTime)) / (1000 * 60 * 60);
                if (hoursSinceLogin < 8) {
                    window.location.replace('index.html');
                } else {
                    localStorage.clear();
                }
            }
        }
        
        // Show error message
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Handle login
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            // Validate inputs
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }
            
            // Disable button and show loading
            const loginBtn = document.querySelector('.login-btn');
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;
            
            try {
                // Try to connect to backend API first
                let response;
                let data;
                
                try {
                    response = await fetch('http://localhost:3000/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });
                    data = await response.json();
                } catch (networkError) {
                    // If backend is not running, use demo credentials
                    console.warn('Backend not available, using demo mode');
                    
                    if (username === 'admin' && password === 'admin123') {
                        data = {
                            success: true,
                            token: 'demo_token_' + Date.now(),
                            user: {
                                id: '1',
                                username: 'admin',
                                name: 'Administrator',
                                role: 'admin'
                            }
                        };
                        response = { ok: true };
                    } else {
                        throw new Error('Invalid credentials');
                    }
                }
                
                if (response && response.ok && data.success) {
                    // Store session data
                    localStorage.setItem('vasma_token', data.token);
                    localStorage.setItem('vasma_user', JSON.stringify(data.user));
                    localStorage.setItem('vasma_login_time', new Date().toISOString());
                    
                    // Show success message
                    showError('Login successful! Redirecting...');
                    errorDiv.style.background = '#e8f5e9';
                    errorDiv.style.color = '#2e7d32';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.replace('index.html');
                    }, 500);
                } else {
                    showError(data.message || 'Invalid username or password');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed. Please check your credentials.');
            } finally {
                // Reset button
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        }
        
        // Add event listeners
        loginForm.addEventListener('submit', handleLogin);
        
        // Add enter key support
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
        
        // Check existing session on page load
        checkExistingSession();
        
        // Focus on username field
        usernameInput.focus();
    </script>
</body>
</html>
